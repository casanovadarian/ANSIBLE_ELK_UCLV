---
- name: Diagnóstico de credenciales
  hosts: all
  gather_facts: false
  tasks:
    - name: Mostrar contraseña por host
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} - elastic_password: {{ elastic_password | default('NO DEFINIDA') }}"
    
    - name: Verificar en el nodo ELK
      ansible.builtin.shell: |
        curl -s -u elastic:{{ elastic_password }} -X GET "https://localhost:9200/_cluster/health" -k
      register: cluster_health_check
      when: inventory_hostname in groups['elk']
      ignore_errors: yes
      
    - name: Mostrar resultado del health check
      ansible.builtin.debug:
        var: cluster_health_check.stdout
      when: inventory_hostname in groups['elk']