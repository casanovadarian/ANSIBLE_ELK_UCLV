---
- name: Diagnóstico completo del ELK stack
  hosts: all
  gather_facts: yes
  tasks:
    - name: Mostrar IP y rol
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} - IP: {{ ansible_default_ipv4.address }} - Rol: {{ group_names }}"

    - name: Verificar contraseña de Elasticsearch
      ansible.builtin.debug:
        msg: "Contraseña de elastic: {{ elastic_password | default('NO DEFINIDA') }}"
      when: inventory_hostname in groups['elk']

    - name: Verificar estado de Elasticsearch
      ansible.builtin.uri:
        url: "http://localhost:9200/_cluster/health"
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: yes
        status_code: 200
      register: es_status
      when: inventory_hostname in groups['elk'] and elastic_password is defined
      ignore_errors: yes

    - name: Mostrar estado del clúster
      ansible.builtin.debug:
        msg: "Estado de Elasticsearch: {{ es_status.json.status if es_status.status == 200 else 'NO ACCESIBLE' }}"
      when: inventory_hostname in groups['elk']

    - name: Verificar Kibana
      ansible.builtin.uri:
        url: "http://localhost:5601/api/status"
        status_code: 200
      register: kibana_status
      when: inventory_hostname in groups['kibana']
      ignore_errors: yes

    - name: Mostrar estado de Kibana
      ansible.builtin.debug:
        msg: "Kibana: {{ 'Disponible' if kibana_status.status == 200 else 'NO DISPONIBLE' }}"
      when: inventory_hostname in groups['kibana']

    - name: Mostrar archivo de configuración de Kibana
      ansible.builtin.shell: |
        grep -E "elasticsearch.username|elasticsearch.password|elasticsearch.hosts" /etc/kibana/kibana.yml
      register: kibana_config
      when: inventory_hostname in groups['kibana']
      ignore_errors: yes

    - name: Configuración de Kibana
      ansible.builtin.debug:
        var: kibana_config.stdout_lines
      when: inventory_hostname in groups['kibana']

- name: Verificar token de Kibana
  ansible.builtin.debug:
    msg: "Token de Kibana: {{ kibana_enrollment_token | default('NO GENERADO') }}"
  when: inventory_hostname in groups['elk']

- name: Verificar autenticación de Kibana
  ansible.builtin.shell: |
    curl -s -o /dev/null -w "%{http_code}" \
      -H "Authorization: Bearer {{ kibana_enrollment_token }}" \
      https://localhost:9200/
  register: token_test
  when: inventory_hostname in groups['elk'] and kibana_enrollment_token is defined
  ignore_errors: yes

- name: Estado del token
  ansible.builtin.debug:
    msg: "Token de Kibana: {{ 'VÁLIDO' if token_test.stdout == '200' else 'INVÁLIDO' }}"
  when: inventory_hostname in groups['elk']