---
# roles/elasticsearch/tasks/main.yml
- name: Instalar Elasticsearch
  ansible.builtin.apt:
    name: elasticsearch
    state: present
    update_cache: yes

- name: Asegurar que el directorio de datos exista con permisos correctos (/mnt/datos)
  ansible.builtin.file:
    path: /mnt/datos
    state: directory
    owner: elasticsearch
    group: elasticsearch
    mode: '0750'

- name: Asegurar que existe /etc/default/elasticsearch
  file:
    path: /etc/default/elasticsearch
    state: touch
    owner: root
    group: root
    mode: '0644'

- name: Asegurar directorio de certificados
  file:
    path: /etc/elasticsearch/certs
    state: directory
    owner: root
    group: elasticsearch
    mode: '0750'

# ============================================
# GESTIÓN DE CERTIFICADOS Y KEYSTORE
# ============================================

- name: Verificar si el directorio certs existe
  ansible.builtin.file:
    path: /etc/elasticsearch/certs
    state: directory
    owner: root
    group: elasticsearch
    mode: '0750'
  when: inventory_hostname in groups['elk']

- name: Comprobar si ya existe una CA personalizada
  ansible.builtin.stat:
    path: /etc/elasticsearch/certs/elastic-stack-ca.p12
  register: ca_cert
  run_once: true
  delegate_to: "{{ groups['elk'][0] }}"

- name: Eliminar certificado de transporte si la CA no existe (primera instalación)
  ansible.builtin.file:
    path: /etc/elasticsearch/certs/transport.p12
    state: absent
  run_once: true
  delegate_to: "{{ groups['elk'][0] }}"
  when: not ca_cert.stat.exists

- name: Generar CA en el primer nodo (sin contraseña)
  ansible.builtin.command: >
    /usr/share/elasticsearch/bin/elasticsearch-certutil ca
    --out /etc/elasticsearch/certs/elastic-stack-ca.p12
    --pass ""
  args:
    creates: /etc/elasticsearch/certs/elastic-stack-ca.p12
  run_once: true
  delegate_to: "{{ groups['elk'][0] }}"
  environment:
    ES_PATH_CONF: /etc/elasticsearch
  when: inventory_hostname == groups['elk'][0]

- name: Generar certificado de transporte (sin contraseña)
  ansible.builtin.command: >
    /usr/share/elasticsearch/bin/elasticsearch-certutil cert
    --ca /etc/elasticsearch/certs/elastic-stack-ca.p12
    --ca-pass ""
    --out /etc/elasticsearch/certs/transport.p12
    --pass ""
  args:
    creates: /etc/elasticsearch/certs/transport.p12
  run_once: true
  delegate_to: "{{ groups['elk'][0] }}"
  environment:
    ES_PATH_CONF: /etc/elasticsearch

- name: Extraer certificado de transporte del primer nodo a la laptop local
  ansible.builtin.fetch:
    src: /etc/elasticsearch/certs/transport.p12
    dest: /tmp/transport.p12
    flat: yes
  run_once: true
  delegate_to: "{{ groups['elk'][0] }}"

- name: Distribuir certificado de transporte a todos los nodos
  ansible.builtin.copy:
    src: /tmp/transport.p12
    dest: /etc/elasticsearch/certs/transport.p12
    owner: elasticsearch
    group: elasticsearch
    mode: '0640'  # Cambiado de 0600 a 0640 para permitir lectura por elasticsearch
  when: inventory_hostname in groups['elk'] and inventory_hostname != groups['elk'][0]

- name: Verificar que todos los nodos tengan el certificado
  ansible.builtin.stat:
    path: /etc/elasticsearch/certs/transport.p12
  register: transport_cert_exists
  when: inventory_hostname in groups['elk']

- name: Asegurar que el certificado existe en todos los nodos
  ansible.builtin.copy:
    src: /tmp/transport.p12
    dest: /etc/elasticsearch/certs/transport.p12
    owner: elasticsearch
    group: elasticsearch
    mode: '0640'  # Cambiado de 0600 a 0640
  when: 
    - inventory_hostname in groups['elk']
    - not transport_cert_exists.stat.exists

# NUEVA TAREA: Asegurar permisos correctos del certificado en TODOS los nodos
- name: Asegurar permisos correctos del certificado transport.p12 en todos los nodos
  ansible.builtin.file:
    path: /etc/elasticsearch/certs/transport.p12
    owner: elasticsearch
    group: elasticsearch
    mode: '0640'
  when: inventory_hostname in groups['elk']

# ============================================
# CONFIGURACIÓN DEL KEYSTORE
# ============================================

- name: Crear keystore de Elasticsearch si no existe
  ansible.builtin.shell: |
    if [ ! -f /etc/elasticsearch/elasticsearch.keystore ]; then
      /usr/share/elasticsearch/bin/elasticsearch-keystore create
    fi
  environment:
    ES_PATH_CONF: /etc/elasticsearch
  when: inventory_hostname in groups['elk']
  notify: Restart Elasticsearch

- name: Verificar si el keystore existe
  ansible.builtin.stat:
    path: /etc/elasticsearch/elasticsearch.keystore
  register: keystore_file
  when: inventory_hostname in groups['elk']

- name: Configurar keystore con contraseñas vacías en TODOS los nodos
  ansible.builtin.shell: |
    # Eliminar entradas existentes si existen
    /usr/share/elasticsearch/bin/elasticsearch-keystore remove xpack.security.transport.ssl.keystore.secure_password 2>/dev/null || true
    /usr/share/elasticsearch/bin/elasticsearch-keystore remove xpack.security.transport.ssl.truststore.secure_password 2>/dev/null || true
    /usr/share/elasticsearch/bin/elasticsearch-keystore remove xpack.security.http.ssl.keystore.secure_password 2>/dev/null || true
    /usr/share/elasticsearch/bin/elasticsearch-keystore remove xpack.security.http.ssl.truststore.secure_password 2>/dev/null || true

    # Agregar contraseñas vacías
    echo "" | /usr/share/elasticsearch/bin/elasticsearch-keystore add -f xpack.security.transport.ssl.keystore.secure_password
    echo "" | /usr/share/elasticsearch/bin/elasticsearch-keystore add -f xpack.security.transport.ssl.truststore.secure_password
    echo "" | /usr/share/elasticsearch/bin/elasticsearch-keystore add -f xpack.security.http.ssl.keystore.secure_password
    echo "" | /usr/share/elasticsearch/bin/elasticsearch-keystore add -f xpack.security.http.ssl.truststore.secure_password
  environment:
    ES_PATH_CONF: /etc/elasticsearch
  register: keystore_result
  changed_when: "'already exists' not in keystore_result.stderr"
  when:
    - inventory_hostname in groups['elk']
    - keystore_file.stat.exists
  notify: Restart Elasticsearch

- name: Establecer permisos del keystore si existe
  ansible.builtin.file:
    path: /etc/elasticsearch/elasticsearch.keystore
    owner: root
    group: elasticsearch
    mode: '0660'
  when: 
    - inventory_hostname in groups['elk']
    - keystore_file.stat.exists

# ============================================
# VERIFICACIÓN DE CERTIFICADOS Y KEYSTORE
# ============================================

# NUEVA TAREA: Asegurar permisos correctos del certificado transport.p12 en TODOS los nodos
- name: Asegurar permisos correctos del certificado transport.p12 en todos los nodos
  ansible.builtin.file:
    path: /etc/elasticsearch/certs/transport.p12
    owner: elasticsearch
    group: elasticsearch
    mode: '0640'
  when: 
    - inventory_hostname in groups['elk']
    - transport_cert_exists.stat.exists | default(false)

# NUEVA TAREA: Asegurar permisos correctos del certificado CA solo en el primer nodo
- name: Asegurar permisos correctos del certificado CA en el primer nodo
  ansible.builtin.file:
    path: /etc/elasticsearch/certs/elastic-stack-ca.p12
    owner: elasticsearch
    group: elasticsearch
    mode: '0640'
  when: 
    - inventory_hostname == groups['elk'][0]
    - ca_cert.stat.exists | default(false)

- name: Verificar que el certificado es legible con contraseña vacía
  ansible.builtin.shell: |
    openssl pkcs12 -in /etc/elasticsearch/certs/transport.p12 -info -nodes -passin pass: -noout 2>&1
  register: cert_check
  when: inventory_hostname in groups['elk']
  ignore_errors: yes
  changed_when: false

- name: Mostrar estado del certificado
  ansible.builtin.debug:
    msg: "Certificado transport.p12 en {{ inventory_hostname }}: {{ 'OK' if cert_check.rc == 0 else 'PROBLEMA' }}"
  when: inventory_hostname in groups['elk']

- name: Desplegar elasticsearch.yml
  ansible.builtin.template:
    src: elasticsearch.yml.j2
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: elasticsearch
    mode: '0660'
  notify: Restart Elasticsearch

- name: Crear directorio override para systemd de Elasticsearch
  ansible.builtin.file:
    path: /etc/systemd/system/elasticsearch.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configurar LimitMEMLOCK infinito para el servicio
  ansible.builtin.copy:
    dest: /etc/systemd/system/elasticsearch.service.d/override.conf
    content: |
      [Service]
      LimitMEMLOCK=infinity
    owner: root
    group: root
    mode: '0644'

- name: Recargar el demonio de systemd
  ansible.builtin.systemd:
    daemon_reload: yes

# Asegurar directorio de logs antes de arrancar el servicio
- name: Asegurar que el directorio de logs existe (/var/log/elasticsearch)
  ansible.builtin.file:
    path: /var/log/elasticsearch
    state: directory
    owner: elasticsearch
    group: elasticsearch
    mode: '0755'
  when: inventory_hostname in groups['elk']

# Asegurar que exista el archivo de logging necesario (log4j2.properties)
- name: Comprobar si /etc/elasticsearch/log4j2.properties existe
  ansible.builtin.stat:
    path: /etc/elasticsearch/log4j2.properties
  register: log4j_dest_stat
  when: inventory_hostname in groups['elk']

- name: Comprobar si existe el archivo de ejemplo en /usr/share
  ansible.builtin.stat:
    path: /usr/share/elasticsearch/config/log4j2.properties
  register: log4j_src_stat
  when: inventory_hostname in groups['elk']

- name: Copiar log4j2.properties desde el paquete si existe y falta en /etc
  ansible.builtin.copy:
    src: /usr/share/elasticsearch/config/log4j2.properties
    dest: /etc/elasticsearch/log4j2.properties
    owner: root
    group: elasticsearch
    mode: '0644'
    remote_src: yes
  when:
    - inventory_hostname in groups['elk']
    - log4j_src_stat.stat.exists
    - not log4j_dest_stat.stat.exists

- name: Crear un log4j2.properties mínimo si no existe plantilla y falta en /etc
  ansible.builtin.copy:
    dest: /etc/elasticsearch/log4j2.properties
    content: |
      status = error
      name = PropertiesConfig

      appender.console.type = Console
      appender.console.name = console
      appender.console.layout.type = PatternLayout
      appender.console.layout.pattern = [%d{ISO8601}] [%t] %-5p %c %marker - %m%n

      rootLogger.level = info
      rootLogger.appenderRef.console.ref = console
    owner: root
    group: elasticsearch
    mode: '0644'
  when:
    - inventory_hostname in groups['elk']
    - not log4j_src_stat.stat.exists
    - not log4j_dest_stat.stat.exists

- name: Iniciar Elasticsearch en el primer nodo para inicializar el bootstrap
  ansible.builtin.systemd:
    name: elasticsearch
    state: started
    enabled: yes
  when: inventory_hostname == groups['elk'][0]

- name: Aplicar reinicios pendientes (cargar nuevos certificados y config en memoria)
  ansible.builtin.meta: flush_handlers

# ============================================
# Iniciar los nodos secundarios para que se unan al clúster existente
# ============================================

- name: Iniciar Elasticsearch en los nodos secundarios del clúster
  ansible.builtin.systemd:
    name: elasticsearch
    state: started
    enabled: yes
  when: inventory_hostname != groups['elk'][0]

- name: Asegurar que Elasticsearch esté iniciado y habilitado
  ansible.builtin.systemd:
    name: elasticsearch
    state: started
    enabled: yes

- name: Esperar a que todos los nodos se unan al clúster antes de tocar seguridad
  ansible.builtin.wait_for:
    host: "{{ item }}"
    port: 9300
    timeout: 120
  loop: "{{ groups['elk'] }}"
  run_once: true

#####################################
# Establecer la contraseña
#####################################

- name: Restablecer contraseña de elastic (modo automático, sin pty)
  ansible.builtin.command: >
    /usr/share/elasticsearch/bin/elasticsearch-reset-password -u elastic -a -b
  environment:
    ES_PATH_CONF: /etc/elasticsearch
  register: password_result
  run_once: true
  delegate_to: "{{ groups['elk'][0] }}"
  changed_when: true

- name: Extraer contraseña generada
  ansible.builtin.set_fact:
    elastic_password: "{{ password_result.stdout.split('New value:')[-1] | trim }}"
  run_once: true

- name: Mostrar contraseña generada
  ansible.builtin.debug:
    msg: "Contraseña de elastic: {{ elastic_password }}"
  run_once: true

- name: Esperar a que el clúster esté realmente sano (yellow/green)
  ansible.builtin.uri:
    url: "https://{{ groups['elk'][0] }}:9200/_cluster/health"
    user: elastic
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
  register: cluster_health_check
  until:
    - cluster_health_check.status == 200
    - cluster_health_check.json.status in ['green', 'yellow']
  retries: 30
  delay: 5
  run_once: true
  delegate_to: "{{ groups['elk'][0] }}"

# ============================================
# Establecer la contraseña del usuario de servicio de Kibana (kibana_system)
# ============================================

- name: Establecer contraseña del usuario de servicio kibana_system
  ansible.builtin.command: >
    /usr/share/elasticsearch/bin/elasticsearch-reset-password -u kibana_system -a -b
  environment:
    ES_PATH_CONF: /etc/elasticsearch
  register: kibana_password_result
  run_once: true
  delegate_to: "{{ groups['elk'][0] }}"
  changed_when: true

- name: Extraer contraseña de kibana_system
  ansible.builtin.set_fact:
    kibana_system_password: "{{ kibana_password_result.stdout.split('New value:')[-1] | trim }}"
  run_once: true

- name: Exponer contraseña de kibana_system a todos los hosts
  ansible.builtin.set_fact:
    kibana_system_password: "{{ kibana_system_password }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['all'] }}"
  run_once: true