# 3. Iniciar los nodos secundarios para que se unan al clúster existente
- name: Iniciar Elasticsearch en los nodos secundarios del clúster
  ansible.builtin.systemd:
    name: elasticsearch
    state: started
    enabled: yes
  when: inventory_hostname != groups['elk'][0]

- name: Asegurar que Elasticsearch esté iniciado y habilitado
  ansible.builtin.systemd:
    name: elasticsearch
    state: started
    enabled: yes

- name: Establecer contraseña para usuario elastic (si no está definida)
  ansible.builtin.shell: |
    /usr/share/elasticsearch/bin/elasticsearch-reset-password -u elastic -i <<< "{{ elastic_password }}"
  environment:
    ES_PATH_CONF: /etc/elasticsearch
  when: elastic_password is defined and elastic_password != ""
  run_once: true
  delegate_to: "{{ groups['elk'][0] }}"
  no_log: true