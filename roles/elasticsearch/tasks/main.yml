---
# roles/elasticsearch/tasks/main.yml
- name: Instalar Elasticsearch
  ansible.builtin.apt:
    name: elasticsearch
    state: present
    update_cache: yes

- name: Asegurar que el directorio de datos exista con permisos correctos (/mnt/datos)
  ansible.builtin.file:
    path: /mnt/datos
    state: directory
    owner: elasticsearch
    group: elasticsearch
    mode: '0750'

- name: Crear directorio certs en todos los nodos
  ansible.builtin.file:
    path: /etc/elasticsearch/certs
    state: directory
    owner: root
    group: elasticsearch
    mode: '0750'

- name: Comprobar si ya existe una CA personalizada
  ansible.builtin.stat:
    path: /etc/elasticsearch/certs/elastic-stack-ca.p12
  register: ca_cert
  run_once: true
  delegate_to: "{{ groups['elk'][0] }}"

- name: Eliminar certificado de transporte de apt solo en la primera instalación
  ansible.builtin.file:
    path: /etc/elasticsearch/certs/transport.p12
    state: absent
  run_once: true
  delegate_to: "{{ groups['elk'][0] }}"
  when: not ca_cert.stat.exists

- name: Generar CA en el primer nodo
  ansible.builtin.command: >
    /usr/share/elasticsearch/bin/elasticsearch-certutil ca --out /etc/elasticsearch/certs/elastic-stack-ca.p12 --pass ""
  args:
    creates: /etc/elasticsearch/certs/elastic-stack-ca.p12
  run_once: true
  delegate_to: "{{ groups['elk'][0] }}"

- name: Generar certificado de transporte sin contraseña en el primer nodo
  ansible.builtin.command: >
    /usr/share/elasticsearch/bin/elasticsearch-certutil cert --ca /etc/elasticsearch/certs/elastic-stack-ca.p12 --ca-pass "" --out /etc/elasticsearch/certs/transport.p12 --pass ""
  args:
    creates: /etc/elasticsearch/certs/transport.p12
  run_once: true
  delegate_to: "{{ groups['elk'][0] }}"

- name: Extraer certificado de transporte del primer nodo a la laptop local
  ansible.builtin.fetch:
    src: /etc/elasticsearch/certs/transport.p12
    dest: /tmp/transport.p12
    flat: yes
  run_once: true
  delegate_to: "{{ groups['elk'][0] }}"

- name: Distribuir certificado de transporte a todos los nodos
  ansible.builtin.copy:
    src: /tmp/transport.p12
    dest: /etc/elasticsearch/certs/transport.p12
    owner: elasticsearch
    group: elasticsearch
    mode: '0600'

- name: Limpiar contraseñas del keystore local en TODOS los nodos
  ansible.builtin.shell: |
    /usr/share/elasticsearch/bin/elasticsearch-keystore remove xpack.security.transport.ssl.keystore.secure_password
    /usr/share/elasticsearch/bin/elasticsearch-keystore remove xpack.security.transport.ssl.truststore.secure_password
  environment:
    ES_PATH_CONF: /etc/elasticsearch
  register: keystore_cleanup
  failed_when: false
  changed_when: keystore_cleanup.rc == 0
  notify: Restart Elasticsearch

- name: Restaurar permisos del keystore tras la limpieza en todos los nodos
  ansible.builtin.file:
    path: /etc/elasticsearch/elasticsearch.keystore
    owner: root
    group: elasticsearch
    mode: '0660'

- name: Desplegar elasticsearch.yml
  ansible.builtin.template:
    src: elasticsearch.yml.j2
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: elasticsearch
    mode: '0660'
  notify: Restart Elasticsearch

- name: Crear directorio override para systemd de Elasticsearch
  ansible.builtin.file:
    path: /etc/systemd/system/elasticsearch.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configurar LimitMEMLOCK infinito para el servicio
  ansible.builtin.copy:
    dest: /etc/systemd/system/elasticsearch.service.d/override.conf
    content: |
      [Service]
      LimitMEMLOCK=infinity
    owner: root
    group: root
    mode: '0644'

- name: Recargar el demonio de systemd
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Iniciar Elasticsearch en el primer nodo para inicializar el bootstrap
  ansible.builtin.systemd:
    name: elasticsearch
    state: started
    enabled: yes
  when: inventory_hostname == groups['elk'][0]

- name: Aplicar reinicios pendientes (cargar nuevos certificados y config en memoria)
  ansible.builtin.meta: flush_handlers

- name: Esperar a que el nodo primario responda en el puerto HTTP (Salud del clúster)
  ansible.builtin.uri:
    url: "http://{{ groups['elk'][0] }}:9200/_cluster/health"
    user: elastic
    password: "{{ elastic_password | default('') }}"
    force_basic_auth: yes
    status_code: [200, 401]
  register: cluster_health
  until: cluster_health.status is defined
  retries: 30
  delay: 5
  run_once: true

