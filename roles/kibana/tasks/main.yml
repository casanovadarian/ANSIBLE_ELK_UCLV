---
- name: Instalar Kibana
  ansible.builtin.apt:
    name: kibana
    state: present
    update_cache: yes
  register: kibana_install

- name: Verificar que el binario de Kibana existe después de la instalación
  ansible.builtin.stat:
    path: /usr/share/kibana/bin/kibana
  register: kibana_binary_check

- name: Asegurar que el binario de Kibana existe
  ansible.builtin.fail:
    msg: "Kibana no se instaló correctamente. El binario /usr/share/kibana/bin/kibana no existe."
  when: not kibana_binary_check.stat.exists

- name: Crear directorio de certificados
  ansible.builtin.file:
    path: /etc/kibana/certs
    state: directory
    owner: root
    group: kibana
    mode: '0750'

- name: Obtener certificado CA para Kibana (descargar a la máquina controladora)
  ansible.builtin.fetch:
    src: "{{ elastic_ca_cert | default('/etc/elasticsearch/certs/elastic-stack-ca.p12') }}"
    dest: /tmp/elastic-stack-ca.p12
    flat: yes
  delegate_to: "{{ groups['elk'][0] }}"
  run_once: true

- name: Copiar certificado CA al nodo Kibana
  ansible.builtin.copy:
    src: /tmp/elastic-stack-ca.p12
    dest: /tmp/elastic-stack-ca.p12
    owner: kibana
    group: kibana
    mode: '0640'
  when: inventory_hostname in groups['kibana']

- name: Verificar que el certificado CA existe
  ansible.builtin.stat:
    path: /tmp/elastic-stack-ca.p12
  register: ca_cert_file
  when: inventory_hostname in groups['kibana']

# CORREGIDO: Extraer el CA correctamente como PEM
- name: Extraer certificado CA del archivo PKCS12
  ansible.builtin.shell: |
    # Extraer el certificado CA del archivo PKCS12
    openssl pkcs12 -in /tmp/elastic-stack-ca.p12 -out /etc/kibana/certs/elasticsearch-ca.pem -cacerts -nokeys -passin pass: 2>/dev/null
    # Si el archivo está vacío o no se extrajo correctamente, extraer todos los certificados
    if [ ! -s /etc/kibana/certs/elasticsearch-ca.pem ]; then
      openssl pkcs12 -in /tmp/elastic-stack-ca.p12 -out /etc/kibana/certs/elasticsearch-ca.pem -clcerts -nokeys -passin pass: 2>/dev/null
    fi
  args:
    creates: /etc/kibana/certs/elasticsearch-ca.pem
  when: 
    - inventory_hostname in groups['kibana']
    - ca_cert_file.stat.exists | default(false)

# NUEVA TAREA: Verificar que el certificado se extrajo correctamente
- name: Verificar que el certificado CA se extrajo correctamente
  ansible.builtin.shell: |
    if [ -f /etc/kibana/certs/elasticsearch-ca.pem ]; then
      head -n 1 /etc/kibana/certs/elasticsearch-ca.pem | grep -q "BEGIN CERTIFICATE"
    fi
  register: cert_verify
  failed_when: false
  changed_when: false
  when: inventory_hostname in groups['kibana']

- name: Extraer certificado usando método alternativo si falló
  ansible.builtin.shell: |
    # Método alternativo: extraer el certificado directamente
    openssl pkcs12 -in /tmp/elastic-stack-ca.p12 -out /etc/kibana/certs/elasticsearch-ca.pem -passin pass: -passout pass: 2>/dev/null
    # Filtrar solo certificados (no claves)
    openssl x509 -in /etc/kibana/certs/elasticsearch-ca.pem -out /etc/kibana/certs/elasticsearch-ca.pem 2>/dev/null
  when: 
    - inventory_hostname in groups['kibana']
    - cert_verify.rc != 0
    - ca_cert_file.stat.exists | default(false)

- name: Establecer permisos del certificado
  ansible.builtin.file:
    path: /etc/kibana/certs/elasticsearch-ca.pem
    owner: root
    group: kibana
    mode: '0640'
  when: inventory_hostname in groups['kibana']

# NUEVA TAREA: Verificar el contenido del certificado
- name: Debug - Verificar certificado
  ansible.builtin.shell: |
    openssl x509 -in /etc/kibana/certs/elasticsearch-ca.pem -text -noout | head -10
  register: cert_info
  changed_when: false
  when: inventory_hostname in groups['kibana']

- name: Debug - Información del certificado
  ansible.builtin.debug:
    var: cert_info.stdout_lines
  when: inventory_hostname in groups['kibana']

- name: Asegurar directorio de logs de Kibana
  ansible.builtin.file:
    path: /var/log/kibana
    state: directory
    owner: kibana
    group: kibana
    mode: '0755'
  when: inventory_hostname in groups['kibana']

- name: Asegurar directorio de datos de Kibana
  ansible.builtin.file:
    path: /var/lib/kibana
    state: directory
    owner: kibana
    group: kibana
    mode: '0755'
  when: inventory_hostname in groups['kibana']

- name: Configurar kibana.yml
  ansible.builtin.template:
    src: kibana.yml.j2
    dest: /etc/kibana/kibana.yml
    owner: root
    group: kibana
    mode: '0644'
  notify: Reiniciar Kibana

# NUEVA TAREA: Asegurar que el archivo de configuración existe
- name: Verificar que kibana.yml existe
  ansible.builtin.stat:
    path: /etc/kibana/kibana.yml
  register: kibana_config_file

- name: Asegurar permisos del binario de Kibana
  ansible.builtin.file:
    path: /usr/share/kibana/bin/kibana
    mode: '0755'
  when: kibana_binary_check.stat.exists

- name: Habilitar e iniciar Kibana
  ansible.builtin.systemd:
    name: kibana
    enabled: yes
    state: restarted
    daemon_reload: yes

- name: Esperar a que Kibana inicie (verificar puerto)
  ansible.builtin.wait_for:
    port: "{{ kibana_port | default(5601) }}"
    host: localhost
    timeout: 120
  when: inventory_hostname == groups['kibana'][0]

- name: Verificar estado de Kibana via API
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port | default(5601) }}/api/status"
    status_code: 200
  register: kibana_status
  until: 
    - kibana_status.status == 200
  retries: 30
  delay: 5
  when: inventory_hostname == groups['kibana'][0]