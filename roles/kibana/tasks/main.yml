#roles/kibana/tasks/main.yml
---
- name: Instalar Kibana
  ansible.builtin.apt:
    name: kibana
    state: present
    update_cache: yes

- name: Crear directorio de certificados
  ansible.builtin.file:
    path: /etc/kibana/certs
    state: directory
    owner: root
    group: kibana
    mode: '0750'

- name: Obtener certificado CA para Kibana
  ansible.builtin.fetch:
    src: "{{ elastic_ca_cert }}"
    dest: /tmp/elastic-stack-ca.p12
    flat: yes
  delegate_to: "{{ groups['elk'][0] }}"
  run_once: true

- name: Convertir certificado a PEM para Kibana
  ansible.builtin.shell: |
    openssl pkcs12 -in /tmp/elastic-stack-ca.p12 -out /etc/kibana/certs/elasticsearch-ca.pem -cacerts -nokeys -passin pass:
  args:
    creates: /etc/kibana/certs/elasticsearch-ca.pem

- name: Establecer permisos del certificado
  ansible.builtin.file:
    path: /etc/kibana/certs/elasticsearch-ca.pem
    owner: root
    group: kibana
    mode: '0640'

- name: Configurar kibana.yml con contraseña
  ansible.builtin.template:
    src: kibana.yml.j2
    dest: /etc/kibana/kibana.yml
    owner: root
    group: kibana
    mode: '0644'
  notify: Reiniciar Kibana

- name: Habilitar e iniciar Kibana
  ansible.builtin.systemd:
    name: kibana
    enabled: yes
    state: started

- name: Esperar a que Kibana esté saludable
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/status"
    status_code: 200
  register: kibana_status
  until: kibana_status.json.status.overall.level == "available"
  retries: 60
  delay: 5
  when: inventory_hostname == groups['kibana'][0]