---
- name: Instalar Kibana
  ansible.builtin.apt:
    name: kibana
    state: present
    update_cache: yes

- name: Crear directorio de certificados
  ansible.builtin.file:
    path: /etc/kibana/certs
    state: directory
    owner: root
    group: kibana
    mode: '0750'

- name: Obtener certificado CA para Kibana
  ansible.builtin.fetch:
    src: "/etc/elasticsearch/certs/elastic-stack-ca.p12"
    dest: /tmp/elastic-stack-ca.p12
    flat: yes
  delegate_to: "{{ groups['elk'][0] }}"
  run_once: true

- name: Convertir certificado a PEM para Kibana
  ansible.builtin.shell: |
    openssl pkcs12 -in /tmp/elastic-stack-ca.p12 -out /etc/kibana/certs/elasticsearch-ca.pem -cacerts -nokeys -passin pass:
  args:
    creates: /etc/kibana/certs/elasticsearch-ca.pem

- name: Establecer permisos del certificado
  ansible.builtin.file:
    path: /etc/kibana/certs/elasticsearch-ca.pem
    owner: root
    group: kibana
    mode: '0640'

# DEBUG - Verificar que la contraseña está disponible
- name: Debug - Mostrar si la contraseña está definida
  ansible.builtin.debug:
    msg: "Contraseña de Elastic: {{ elastic_password | default('NO DEFINIDA') }}"

- name: Configurar kibana.yml con contraseña
  ansible.builtin.template:
    src: kibana.yml.j2
    dest: /etc/kibana/kibana.yml
    owner: root
    group: kibana
    mode: '0644'
  notify: Reiniciar Kibana

- name: Debug - Mostrar contenido de kibana.yml
  ansible.builtin.shell: |
    cat /etc/kibana/kibana.yml | grep password
  register: kibana_config_debug
  changed_when: false

- name: Debug - Resultado
  ansible.builtin.debug:
    var: kibana_config_debug.stdout_lines

- name: Habilitar e iniciar Kibana
  ansible.builtin.systemd:
    name: kibana
    enabled: yes
    state: started

- name: Esperar a que Kibana esté saludable
  ansible.builtin.uri:
    url: "http://localhost:{{ kibana_port }}/api/status"
    status_code: 200
  register: kibana_status
  until: 
    - kibana_status.status == 200
    - kibana_status.json is defined
    - kibana_status.json.status is defined
    - kibana_status.json.status.overall is defined
    - kibana_status.json.status.overall.level == "available"
  retries: 60
  delay: 5
  when: inventory_hostname == groups['kibana'][0]