---
- name: Instalar Logstash
  ansible.builtin.apt:
    name: logstash
    state: present
    update_cache: yes

- name: Crear directorios de configuración y certificados
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: logstash
    mode: '0750'
  loop:
    - /etc/logstash/conf.d
    - /etc/logstash/certs

- name: Obtener certificado CA para Logstash
  ansible.builtin.fetch:
    src: "{{ elastic_ca_cert | default('/etc/elasticsearch/certs/elastic-stack-ca.p12') }}"
    dest: /tmp/elastic-stack-ca.p12
    flat: yes
  delegate_to: "{{ groups['elk'][0] }}"
  run_once: true

# CORREGIDO: Usar monitoring en lugar de logstash
- name: Copiar certificado CA al nodo Logstash
  ansible.builtin.copy:
    src: /tmp/elastic-stack-ca.p12
    dest: /tmp/elastic-stack-ca.p12
    owner: logstash
    group: logstash
    mode: '0640'
  when: inventory_hostname in groups['monitoring']

- name: Convertir certificado a PEM para Logstash
  ansible.builtin.shell: |
    openssl pkcs12 -in /tmp/elastic-stack-ca.p12 -out /etc/logstash/certs/elasticsearch-ca.pem -cacerts -nokeys -passin pass:
  args:
    creates: /etc/logstash/certs/elasticsearch-ca.pem
  when: inventory_hostname in groups['monitoring']

- name: Establecer permisos del certificado
  ansible.builtin.file:
    path: /etc/logstash/certs/elasticsearch-ca.pem
    owner: root
    group: logstash
    mode: '0640'
  when: inventory_hostname in groups['monitoring']

- name: Desplegar archivos de configuración de pipelines
  ansible.builtin.copy:
    src: conf.d/
    dest: /etc/logstash/conf.d/
    owner: root
    group: logstash
    mode: '0644'
    directory_mode: '0750'
  when: inventory_hostname in groups['monitoring']
  notify: Reiniciar Logstash

- name: Verificar sintaxis de configuración de Logstash
  ansible.builtin.command: |
    /usr/share/logstash/bin/logstash --config.test_and_exit -f /etc/logstash/conf.d/
  register: logstash_config_test
  changed_when: false
  failed_when: false
  when: inventory_hostname in groups['monitoring']

- name: Debug - Resultado de verificación de sintaxis
  ansible.builtin.debug:
    var: logstash_config_test.stdout_lines
  when: 
    - inventory_hostname in groups['monitoring']
    - logstash_config_test is defined

- name: Fallar si la configuración de Logstash tiene errores
  ansible.builtin.fail:
    msg: "La configuración de Logstash tiene errores. Verifica los archivos en /etc/logstash/conf.d/"
  when: 
    - inventory_hostname in groups['monitoring']
    - logstash_config_test.rc != 0

- name: Habilitar e iniciar Logstash
  ansible.builtin.systemd:
    name: logstash
    enabled: yes
    state: started
    daemon_reload: yes

- name: Esperar a que Logstash inicie
  ansible.builtin.wait_for:
    port: 9600
    host: localhost
    timeout: 60
  when: inventory_hostname in groups['monitoring']

- name: Verificar que Logstash está corriendo
  ansible.builtin.systemd:
    name: logstash
    state: started
  register: logstash_status

- name: Debug - Estado de Logstash
  ansible.builtin.debug:
    msg: "Logstash está {{ 'corriendo' if logstash_status.status.ActiveState == 'active' else 'detenido' }}"
  when: inventory_hostname in groups['monitoring']

- name: Verificar API de Logstash
  ansible.builtin.uri:
    url: "http://localhost:9600/_node/stats"
    status_code: 200
  register: logstash_api
  until: logstash_api.status == 200
  retries: 10
  delay: 5
  when: inventory_hostname in groups['monitoring']
  ignore_errors: yes

- name: Debug - Estado de API de Logstash
  ansible.builtin.debug:
    msg: "API de Logstash: {{ 'OK' if logstash_api.status == 200 else 'FAILED' }}"
  when: 
    - inventory_hostname in groups['monitoring']
    - logstash_api is defined