---
- name: Instalar Logstash
  ansible.builtin.apt:
    name: logstash
    state: present
    update_cache: yes
  register: logstash_install

- name: Verificar que el binario de Logstash existe después de la instalación
  ansible.builtin.stat:
    path: /usr/share/logstash/bin/logstash
  register: logstash_binary_check

- name: Asegurar que el binario de Logstash existe
  ansible.builtin.fail:
    msg: "Logstash no se instaló correctamente. El binario /usr/share/logstash/bin/logstash no existe."
  when: not logstash_binary_check.stat.exists

- name: Crear directorios de configuración y certificados
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: logstash
    mode: '0750'
  loop:
    - /etc/logstash/conf.d
    - /etc/logstash/certs

- name: Obtener certificado CA para Logstash
  ansible.builtin.fetch:
    src: "{{ elastic_ca_cert | default('/etc/elasticsearch/certs/elastic-stack-ca.p12') }}"
    dest: /tmp/elastic-stack-ca.p12
    flat: yes
  delegate_to: "{{ groups['elk'][0] }}"
  run_once: true

- name: Copiar certificado CA al nodo Logstash
  ansible.builtin.copy:
    src: /tmp/elastic-stack-ca.p12
    dest: /tmp/elastic-stack-ca.p12
    owner: logstash
    group: logstash
    mode: '0640'
  when: inventory_hostname in groups['monitoring']

- name: Verificar que el certificado CA existe
  ansible.builtin.stat:
    path: /tmp/elastic-stack-ca.p12
  register: ca_cert_file

- name: Convertir certificado a PEM para Logstash
  ansible.builtin.shell: |
    if [ ! -f /etc/logstash/certs/elasticsearch-ca.pem ]; then
      openssl pkcs12 -in /tmp/elastic-stack-ca.p12 -out /etc/logstash/certs/elasticsearch-ca.pem -cacerts -nokeys -passin pass:
    fi
  args:
    creates: /etc/logstash/certs/elasticsearch-ca.pem
  when: 
    - inventory_hostname in groups['monitoring']
    - ca_cert_file.stat.exists

- name: Establecer permisos del certificado
  ansible.builtin.file:
    path: /etc/logstash/certs/elasticsearch-ca.pem
    owner: root
    group: logstash
    mode: '0640'
  when: inventory_hostname in groups['monitoring']

- name: Desplegar archivos de configuración de pipelines
  ansible.builtin.copy:
    src: conf.d/
    dest: /etc/logstash/conf.d/
    owner: root
    group: logstash
    mode: '0644'
    directory_mode: '0750'
  when: inventory_hostname in groups['monitoring']
  notify: Reiniciar Logstash

- name: Verificar sintaxis de configuración de Logstash
  ansible.builtin.shell: |
    /usr/share/logstash/bin/logstash --config.test_and_exit -f /etc/logstash/conf.d/ 2>&1
  register: logstash_config_test
  changed_when: false
  failed_when: false
  when: inventory_hostname in groups['monitoring']

- name: Debug - Resultado de verificación de sintaxis
  ansible.builtin.debug:
    msg: |
      Código de salida: {{ logstash_config_test.rc }}
      {{ logstash_config_test.stdout_lines | join('\n') if logstash_config_test.stdout_lines is defined else '' }}
      {{ logstash_config_test.stderr_lines | join('\n') if logstash_config_test.stderr_lines is defined else '' }}
  when: 
    - inventory_hostname in groups['monitoring']
    - logstash_config_test is defined
    - logstash_config_test.rc != 0

- name: Fallar si la configuración de Logstash tiene errores
  ansible.builtin.fail:
    msg: |
      La configuración de Logstash tiene errores.
      Código de salida: {{ logstash_config_test.rc }}
      Error: {{ logstash_config_test.stderr_lines | join('\n') if logstash_config_test.stderr_lines is defined else logstash_config_test.stdout_lines | join('\n') }}
  when: 
    - inventory_hostname in groups['monitoring']
    - logstash_config_test.rc != 0

- name: Asegurar directorio de logs de Logstash
  ansible.builtin.file:
    path: /var/log/logstash
    state: directory
    owner: logstash
    group: logstash
    mode: '0755'
  when: inventory_hostname in groups['monitoring']

- name: Asegurar directorio de datos de Logstash
  ansible.builtin.file:
    path: /var/lib/logstash
    state: directory
    owner: logstash
    group: logstash
    mode: '0755'
  when: inventory_hostname in groups['monitoring']

- name: Habilitar e iniciar Logstash
  ansible.builtin.systemd:
    name: logstash
    enabled: yes
    state: started
    daemon_reload: yes

- name: Esperar a que Logstash inicie (verificar puerto)
  ansible.builtin.wait_for:
    port: 9600
    host: localhost
    timeout: 60
  when: inventory_hostname in groups['monitoring']

- name: Verificar API de Logstash
  ansible.builtin.uri:
    url: "http://localhost:9600/_node/stats"
    status_code: 200
  register: logstash_api
  until: logstash_api.status == 200
  retries: 10
  delay: 5
  when: inventory_hostname in groups['monitoring']
  ignore_errors: yes

- name: Debug - Estado de Logstash
  ansible.builtin.debug:
    msg: |
      Logstash API: {{ 'OK' if logstash_api.status == 200 else 'FAILED' }}
      Logstash está corriendo: {{ logstash_status.status.ActiveState == 'active' if logstash_status is defined else 'desconocido' }}
  when: inventory_hostname in groups['monitoring']