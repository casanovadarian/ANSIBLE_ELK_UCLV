---
# site.yml

- name: Inicialización
  hosts: localhost
  gather_facts: false

  vars_prompt:
    - name: local_become_pass
      prompt: "Contraseña de sudo para localhost"
      private: true

  tasks:
    - name: Guardar contraseña para el resto de la ejecución
      ansible.builtin.set_fact:
        ansible_become_pass: "{{ local_become_pass }}"

# 0. Recolectar facts de todos los hosts que vamos a usar (remotos + laptop local)
#    Necesario porque local.yaml de tinyproxy usa hostvars de elk/monitoring
- name: Recolectar facts
  hosts: localhost,elk,monitoring
  gather_facts: yes

# 1. Repos UCLV + actualización de paquetes (solo nodos remotos)
- name: Preparación de repositorios y paquetes
  hosts: elk,monitoring
  become: yes
  roles:
    - 01reposUCLV

# 2a. Tinyproxy: servidor en localhost (play propio, bloquea hasta terminar)
- name: Configurar servidor Tinyproxy (localhost)
  hosts: localhost
  become: yes
  vars:
    ansible_become_pass: "{{ local_become_pass }}"
  roles:
    - 02tinyproxy

# 2b. Tinyproxy: clientes en los nodos remotos
#     Arranca solo cuando 2a terminó por completo -> tinyproxy_host/tinyproxy_port
#     ya existen en hostvars['localhost'] de forma garantizada.
- name: Configurar clientes Tinyproxy (nodos remotos)
  hosts: elk,monitoring
  become: yes
  roles:
    - 02tinyproxy

# 3. Rol Common: Configuraciones base y dependencias
- name: Aplicar configuraciones comunes
  hosts: elk,monitoring
  become: yes
  roles:
    - common

# 4. Rol Elasticsearch: Instalar y configurar el clúster
- name: Desplegar clúster de Elasticsearch
  hosts: elk
  become: yes
  roles:
    - elasticsearch

# 5. Rol Kibana
- name: Desplegar Kibana
  hosts: kibana
  become: yes
  vars:
    ansible_become_pass: "{{ hostvars['localhost']['local_become_pass'] | default('') }}"
    elastic_password: "{{ hostvars[groups['elk'][0]]['elastic_password'] | default('') }}"
  roles:
    - kibana

# 6. Rol Logstash
- name: Desplegar Logstash
  hosts: monitoring  
  become: yes
#  vars:
#    ansible_become_pass: "{{ local_become_pass }}"
  roles:
    - logstash
  
# 7. Mostrar credenciales generadas
- name: Mostrar información de acceso
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Mostrar credenciales de Elasticsearch
      ansible.builtin.debug:
        msg: |
          ========================================
          ACCESO AL CLÚSTER ELASTICSEARCH
          ========================================
          URL: https://{{ hostvars[groups['elk'][0]]['ansible_default_ipv4']['address'] }}:9200
          Usuario: elastic
          Contraseña: {{ hostvars[groups['elk'][0]]['elastic_password'] }}
          ========================================
          ACCESO A KIBANA
          ========================================
          URL: http://{{ hostvars[groups['kibana'][0]]['ansible_default_ipv4']['address'] }}:5601
          Usuario: elastic
          Contraseña: {{ hostvars[groups['elk'][0]]['elastic_password'] }}
          ========================================

    - name: Guardar credenciales en archivo local
      ansible.builtin.copy:
        content: |
          ELASTICSEARCH CLUSTER CREDENTIALS
          =================================
          Generated: {{ ansible_date_time.iso8601 }}
          
          Elasticsearch URL: https://{{ hostvars[groups['elk'][0]]['ansible_default_ipv4']['address'] }}:9200
          Username: elastic
          Password: {{ hostvars[groups['elk'][0]]['elastic_password'] }}
          
          Kibana URL: http://{{ hostvars[groups['kibana'][0]]['ansible_default_ipv4']['address'] }}:5601
          Username: elastic
          Password: {{ hostvars[groups['elk'][0]]['elastic_password'] }}
        dest: "~/elastic_credentials_{{ ansible_date_time.epoch }}.txt"
        mode: '0600'