---
- name: Limpiar completamente Elastic Stack
  hosts: elasticsearch
  become: true
  gather_facts: true

  vars:
    purge_packages: false

    elastic_services:
      - elasticsearch
      - kibana
      - logstash

    elastic_packages:
      - elasticsearch
      - kibana
      - logstash

    elastic_directories:
      - /etc/elasticsearch
      - /etc/kibana
      - /etc/logstash

      - /var/lib/elasticsearch
      - /var/lib/kibana
      - /var/lib/logstash

      - /var/log/elasticsearch
      - /var/log/kibana
      - /var/log/logstash

      # Si utilizas un path.data personalizado
      - /mnt/datos

      # Directorios de ejecución
      - /var/run/elasticsearch
      - /var/run/kibana
      - /var/run/logstash

      # Directorios de instalación
      - /usr/share/elasticsearch
      - /usr/share/kibana
      - /usr/share/logstash

    temporary_files:
      - /tmp/http.p12
      - /tmp/transport.p12
      - /tmp/http_ca.crt
      - /tmp/elastic-stack-ca.p12

    repositories:
      - /etc/apt/sources.list.d/elastic.list

    gpg_keys:
      - /usr/share/keyrings/elasticsearch-keyring.gpg

  tasks:

  ####################################################
  # Detener servicios
  ####################################################

    - name: Detener servicios
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop: "{{ elastic_services }}"
      ignore_errors: true

    - name: Deshabilitar servicios
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
      loop: "{{ elastic_services }}"
      ignore_errors: true

  ####################################################
  # Matar procesos residuales
  ####################################################

    - name: Finalizar procesos restantes
      ansible.builtin.shell: |
        pkill -9 -f {{ item }} || true
      loop: "{{ elastic_services }}"
      changed_when: false

  ####################################################
  # Eliminar archivos temporales
  ####################################################

    - name: Eliminar archivos temporales
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ temporary_files }}"

  ####################################################
  # Eliminar directorios
  ####################################################

    - name: Eliminar directorios
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ elastic_directories }}"

  ####################################################
  # Eliminar repositorios
  ####################################################

    - name: Eliminar repositorios de Elastic
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ repositories }}"

    - name: Eliminar llaves GPG
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ gpg_keys }}"

  ####################################################
  # Desinstalar paquetes
  ####################################################

    - name: Eliminar paquetes
      ansible.builtin.apt:
        name: "{{ elastic_packages }}"
        state: absent
        purge: yes
      when: purge_packages

    - name: Eliminar dependencias no utilizadas
      ansible.builtin.apt:
        autoremove: yes
        purge: yes
      when: purge_packages

    - name: Limpiar caché de apt
      ansible.builtin.apt:
        autoclean: yes
      when: purge_packages

  ####################################################
  # Eliminar usuarios
  ####################################################

    - name: Eliminar usuario elasticsearch
      ansible.builtin.user:
        name: elasticsearch
        state: absent
        remove: yes
      ignore_errors: true

    - name: Eliminar grupo elasticsearch
      ansible.builtin.group:
        name: elasticsearch
        state: absent
      ignore_errors: true

  ####################################################
  # Recargar systemd
  ####################################################

    - name: Recargar systemd
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Limpiar estado de servicios fallidos
      ansible.builtin.command:
        cmd: systemctl reset-failed
      changed_when: false

    - name: Actualizar caché de apt
      ansible.builtin.apt:
        update_cache: yes
      when: purge_packages