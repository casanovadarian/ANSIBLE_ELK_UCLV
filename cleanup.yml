---
# cleanup.yml
# Limpieza completa Elastic Stack
# Elasticsearch + Kibana + Logstash

- name: Limpiar completamente Elastic Stack
  hosts: elk,kibana,monitoring
  become: true
  gather_facts: true

  vars:

    # Cambiar a true si quieres eliminar paquetes completamente
    purge_packages: false


    ####################################################
    # Servicios
    ####################################################

    elastic_services:
      - elasticsearch
      - kibana
      - logstash


    ####################################################
    # Paquetes Elastic
    ####################################################

    elastic_packages:
      - elasticsearch
      - kibana
      - logstash


    ####################################################
    # Directorios generales Elastic Stack
    ####################################################

    elastic_directories:

      # Configuración
      - /etc/elasticsearch
      - /etc/kibana
      - /etc/logstash

      - /etc/default/elasticsearch
      - /etc/default/kibana
      - /etc/default/logstash


      # Datos
      - /mnt/datos
      - /var/lib/elasticsearch
      - /var/lib/kibana
      - /var/lib/logstash


      # Logs
      - /var/log/elasticsearch
      - /var/log/kibana
      - /var/log/logstash


      # Instalación
      - /usr/share/elasticsearch
      - /usr/share/kibana
      - /usr/share/logstash


      # Runtime
      - /var/run/elasticsearch
      - /var/run/kibana
      - /var/run/logstash


    ####################################################
    # Certificados temporales
    ####################################################

    temporary_files:

      - /tmp/http.p12
      - /tmp/transport.p12
      - /tmp/http_ca.crt
      - /tmp/elastic-stack-ca.p12


    ####################################################
    # Repositorio Elastic - BUSCAR Y ELIMINAR TODOS
    ####################################################

    # Ya no usamos una lista fija, usaremos find para buscar

    ####################################################
    # Llaves GPG
    ####################################################

    elastic_gpg:

      - /usr/share/keyrings/elasticsearch-keyring.gpg



  tasks:


  ####################################################
  # 1. DETENER SERVICIOS
  ####################################################


    - name: Detener Elasticsearch
      ansible.builtin.systemd:
        name: elasticsearch
        state: stopped
        enabled: false
      when:
        - inventory_hostname in groups['elk'] | default([])
      ignore_errors: true


    - name: Detener Kibana
      ansible.builtin.systemd:
        name: kibana
        state: stopped
        enabled: false
      when:
        - inventory_hostname in groups['kibana'] | default([])
      ignore_errors: true


    - name: Detener Logstash
      ansible.builtin.systemd:
        name: logstash
        state: stopped
        enabled: false
      when:
        - inventory_hostname in groups['monitoring'] | default([])
      ignore_errors: true



  ####################################################
  # 2. MATAR PROCESOS RESIDUALES
  ####################################################


    - name: Finalizar procesos Elastic restantes
      ansible.builtin.shell: |
        pkill -9 -f elasticsearch || true
        pkill -9 -f kibana || true
        pkill -9 -f logstash || true
      changed_when: false
      ignore_errors: true



  ####################################################
  # 3. ELIMINAR ARCHIVOS TEMPORALES
  ####################################################


    - name: Eliminar certificados temporales
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ temporary_files }}"



  ####################################################
  # 4. ELIMINAR DIRECTORIOS
  ####################################################


    - name: Eliminar directorios Elastic Stack
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ elastic_directories }}"



  ####################################################
  # 5. ELIMINAR REPOSITORIOS Y LLAVES
  ####################################################


    - name: Buscar archivos de repositorio de Elastic
      ansible.builtin.find:
        paths: /etc/apt/sources.list.d/
        patterns: "*elastic*"
        file_type: file
      register: elastic_repo_files


    - name: Eliminar archivos de repositorio de Elastic
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ elastic_repo_files.files }}"
      when: elastic_repo_files.files | length > 0


    - name: Buscar archivos de repositorio de Elastic (alternativos)
      ansible.builtin.find:
        paths: /etc/apt/
        patterns: "*elastic*"
        file_type: file
        recurse: yes
      register: elastic_repo_files_alt


    - name: Eliminar archivos de repositorio de Elastic (alternativos)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ elastic_repo_files_alt.files }}"
      when: elastic_repo_files_alt.files | length > 0


    - name: Eliminar llave GPG Elastic
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ elastic_gpg }}"



  ####################################################
  # 6. DESINSTALAR PAQUETES (OPCIONAL)
  ####################################################


    - name: Desinstalar paquetes Elastic
      ansible.builtin.apt:
        name: "{{ elastic_packages }}"
        state: absent
        purge: yes
      when: purge_packages
      ignore_errors: true


    - name: Limpiar dependencias sobrantes
      ansible.builtin.apt:
        autoremove: yes
        purge: yes
      when: purge_packages


    - name: Limpiar cache apt
      ansible.builtin.apt:
        autoclean: yes
      when: purge_packages



  ####################################################
  # 7. ACTUALIZAR CACHE APT (SIEMPRE)
  ####################################################


    - name: Actualizar cache apt después de limpieza
      ansible.builtin.apt:
        update_cache: yes
      ignore_errors: true



  ####################################################
  # 8. ELIMINAR CREDENCIALES LOCALES
  ####################################################


    - name: Buscar archivos de credenciales
      ansible.builtin.find:
        paths:
          - "{{ lookup('env','HOME') }}"
        patterns:
          - "elastic_credentials_*.txt"
          - "kibana_token_*.txt"
          - "elastic_password_*.txt"
        file_type: file
      delegate_to: localhost
      become: false
      register: credential_files
      run_once: true


    - name: Eliminar credenciales locales
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ credential_files.files }}"
      delegate_to: localhost
      become: false
      run_once: true



  ####################################################
  # 9. SYSTEMD
  ####################################################


    - name: Recargar systemd
      ansible.builtin.systemd:
        daemon_reload: yes


    - name: Limpiar servicios fallidos
      ansible.builtin.command:
        cmd: systemctl reset-failed
      changed_when: false



  ####################################################
  # 10. RESUMEN
  ####################################################


    - name: Mostrar resumen limpieza
      ansible.builtin.debug:
        msg: |
          =====================================
          LIMPIEZA ELASTIC STACK COMPLETADA
          =====================================

          Nodo:
          {{ inventory_hostname }}

          Grupos:
          {{ group_names | join(', ') }}

          Eliminado:
          ✔ Servicios detenidos
          ✔ Procesos residuales
          ✔ Datos Elasticsearch (/mnt/datos)
          ✔ Configuración
          ✔ Logs
          ✔ Certificados
          ✔ Repositorios Elastic
          ✔ Llaves GPG
          ✔ Cache APT actualizado

          Paquetes eliminados:
          {{ 'SI' if purge_packages else 'NO' }}

          =====================================
      run_once: true